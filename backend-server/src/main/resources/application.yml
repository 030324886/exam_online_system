server:
  port: 8081
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 关键：添加 allowPublicKeyRetrieval=true + useSSL=false
    url: jdbc:mysql://localhost:3306/exam_online?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 11223344  # 替换为你本地MySQL密码

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.stu.backendserver.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl